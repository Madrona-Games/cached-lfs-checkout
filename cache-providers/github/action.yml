name: "GitHub Cache Provider"
description: "Cache LFS files using GitHub Actions cache"

inputs:
  path:
    description: "The paths to cache"
    required: true
  key:
    description: "The cache key"
    required: true
  restore-keys:
    description: "The restore keys"
    required: true
  enableCrossOsArchive:
    description: "Whether the cache is cross-os compatible"
    required: false
    default: false
  restoreOnly:
    description: "Only restore the cache, do not save the cache"
    required: false
    default: false

runs:
  using: "composite"
  steps:
    - name: Restore LFS cache from Github
      uses: actions/cache@v5
      if: inputs.restoreOnly == 'false'
      with:
        path: ${{ inputs.path }}
        key: ${{ inputs.key }}
        restore-keys: ${{ inputs.restore-keys }}
        enableCrossOsArchive: ${{ inputs.enableCrossOsArchive }}

    - name: Restore Only LFS cache from Github
      uses: actions/cache/restore@v5
      if: inputs.restoreOnly == 'true'
      with:
        path: ${{ inputs.path }}
        key: ${{ inputs.key }}
        restore-keys: ${{ inputs.restore-keys }}
        enableCrossOsArchive: ${{ inputs.enableCrossOsArchive }}
